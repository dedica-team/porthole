<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes blink {
      0%, 90%, 100% { r: 2.5; opacity: 0.8; }
      95%            { r: 0;   opacity: 0;   }
    }
    #eye { animation: blink 4s ease-in-out infinite; }
  </style>
  <polygon points="36,3 65,19.5 65,52.5 36,69 7,52.5 7,19.5"
    fill="none" stroke="hsl(185,100%,54%)" stroke-width="1.5"/>
  <polygon points="36,14 55,25 55,47 36,58 17,47 17,25"
    fill="rgba(0,240,255,0.07)" stroke="hsl(185,100%,54%)" stroke-width="1"/>
  <line x1="36" y1="3" x2="36" y2="69" stroke="hsl(185,100%,54%)" stroke-width="0.6" opacity="0.35"/>
  <line x1="7" y1="19.5" x2="65" y2="52.5" stroke="hsl(185,100%,54%)" stroke-width="0.6" opacity="0.35"/>
  <line x1="65" y1="19.5" x2="7" y2="52.5" stroke="hsl(185,100%,54%)" stroke-width="0.6" opacity="0.35"/>
  <circle cx="36" cy="36" r="6" fill="none" stroke="hsl(185,100%,54%)" stroke-width="1.5"/>
  <circle id="eye" cx="36" cy="36" r="2.5" fill="hsl(0,100%,54%)" opacity="0.8"/>
  <!-- hinges on the left edge -->
  <line x1="4" y1="30.5" x2="10" y2="30.5" stroke="hsl(185,100%,54%)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="4" y1="41.5" x2="10" y2="41.5" stroke="hsl(185,100%,54%)" stroke-width="1.5" stroke-linecap="round"/>
</svg>

