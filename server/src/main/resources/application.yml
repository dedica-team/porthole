micronaut:
  server:
    port: 8080
    cors:
      enabled: true
      configurations:
        default:
          allowed-origins: ${PORTHOLE_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
          allowed-methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          allow-credentials: true
  router:
    static-resources:
      default:
        paths: classpath:static
        mapping: /**
  security:
    # Static assets / SPA routes and public API must resolve to 404/200, not 401.
    reject-not-found: false
    # First matching pattern wins, so public rules must come before "/**".
    intercept-url-map:
      - pattern: /actuator/**
        access:
          - isAnonymous()
      - pattern: /health
        access:
          - isAnonymous()
      - pattern: /api/auth/**
        access:
          - isAnonymous()
      - pattern: /oauth2/**
        access:
          - isAnonymous()
      - pattern: /login/oauth2/**
        access:
          - isAnonymous()
      - pattern: /
        access:
          - isAnonymous()
      - pattern: /index.html
        access:
          - isAnonymous()
      - pattern: /favicon.ico
        access:
          - isAnonymous()
      - pattern: /assets/**
        access:
          - isAnonymous()
      - pattern: /fonts/**
        access:
          - isAnonymous()
      - pattern: '/*.js'
        access:
          - isAnonymous()
      - pattern: '/*.css'
        access:
          - isAnonymous()
      - pattern: '/*.svg'
        access:
          - isAnonymous()
      - pattern: '/*.ico'
        access:
          - isAnonymous()
      - pattern: '/*.png'
        access:
          - isAnonymous()
      - pattern: '/*.webmanifest'
        access:
          - isAnonymous()
      - pattern: '/*.map'
        access:
          - isAnonymous()
      - pattern: '/*.woff'
        access:
          - isAnonymous()
      - pattern: '/*.woff2'
        access:
          - isAnonymous()
      - pattern: /auth/**
        access:
          - isAnonymous()
      - pattern: /lobby
        access:
          - isAnonymous()
      - pattern: /lobby/**
        access:
          - isAnonymous()
      - pattern: /map/**
        access:
          - isAnonymous()
      - pattern: /**
        access:
          - isAuthenticated()
    oauth2:
      # Preserve the Spring OAuth2 URLs the client relies on.
      login-uri: /oauth2/authorization{/provider}
      callback-uri: /login/oauth2/code{/provider}
      clients:
        keycloak:
          client-id: ${PORTHOLE_KEYCLOAK_CLIENT_ID:}
          client-secret: ${PORTHOLE_KEYCLOAK_CLIENT_SECRET:}
          openid:
            issuer: ${PORTHOLE_KEYCLOAK_ISSUER_URI:}

jackson:
  # Use reflection + jackson-module-kotlin for (de)serialization so Kotlin
  # default parameter values are honored; @Introspected is still used for validation.
  bean-introspection-module: false
  # Spring's default is to serialise empty collections/maps too; keep that contract.
  serialization-inclusion: ALWAYS

endpoints:
  # Match Spring's management exposure: health only.
  all:
    enabled: false
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS

porthole:
  auth:
    cookie:
      cookie-name: ${PORTHOLE_AUTH_COOKIE_NAME:porthole_auth}
      cookie-path: ${PORTHOLE_AUTH_COOKIE_PATH:/}
      cookie-same-site: ${PORTHOLE_AUTH_COOKIE_SAME_SITE:Lax}
      cookie-secure: ${PORTHOLE_AUTH_COOKIE_SECURE:false}
    jwt:
      secret: ${PORTHOLE_JWT_SECRET:change-me-in-production-this-is-not-a-real-secret!!}
      expiration-ms: ${PORTHOLE_JWT_EXPIRATION_MS:86400000}
      issuer: ${PORTHOLE_JWT_ISSUER:porthole}
      audience: ${PORTHOLE_JWT_AUDIENCE:porthole-api}
    allowed-origins: ${PORTHOLE_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
    github:
      client-id: ${PORTHOLE_GITHUB_CLIENT_ID:}
      client-secret: ${PORTHOLE_GITHUB_CLIENT_SECRET:}
      redirect-uri: ${PORTHOLE_GITHUB_REDIRECT_URI:http://localhost:5173/auth/github/callback}
    keycloak:
      client-id: ${PORTHOLE_KEYCLOAK_CLIENT_ID:}
      client-secret: ${PORTHOLE_KEYCLOAK_CLIENT_SECRET:}
      issuer-uri: ${PORTHOLE_KEYCLOAK_ISSUER_URI:}
      redirect-uri: ${PORTHOLE_KEYCLOAK_REDIRECT_URI:http://localhost:5173/auth/keycloak/callback}
    webauthn:
      rp-id: ${PORTHOLE_WEBAUTHN_RP_ID:}
      rp-name: ${PORTHOLE_WEBAUTHN_RP_NAME:porthole}
      origin: ${PORTHOLE_WEBAUTHN_ORIGIN:http://localhost:5173}
    tagline: ${PORTHOLE_TAGLINE:for teams}
  demo:
    enabled: ${PORTHOLE_DEMO_ENABLED:false}
  storage:
    path: ${PORTHOLE_STORAGE_PATH:../data/json}
    flush-interval-ms: 5000
    debounce-ms: 5000
  admin:
    user-ids: ${PORTHOLE_ADMIN_USER_IDS:}
