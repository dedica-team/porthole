micronaut:
  server:
    cors:
      enabled: true
      configurations:
        default:
          allowed-origins:
            - http://localhost:5173
          allowed-methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          allow-credentials: true

endpoints:
  all:
    enabled: false
  health:
    enabled: true
    sensitive: false

porthole:
  auth:
    cookie:
      cookie-name: "porthole_auth"
      cookie-path: "/"
      cookie-same-site: "Lax"
      cookie-secure: false
    jwt:
      secret: "test-secret-key-for-unit-tests-only-do-not-use-in-production-256bit!!"
      expiration-ms: 3600000
      issuer: "porthole-test"
      audience: "porthole-test-api"
    github:
      client-id: test-client-id
      client-secret: test-client-secret
      redirect-uri: "http://localhost:5173/auth/github/callback"
    allowed-origins: "http://localhost:5173"
  storage:
    # Relative to the module working directory; lives under target/ so it is cleaned
    # by `mvn clean` and never pollutes the source tree.
    path: ${porthole.test.storage.path:target/porthole-test-storage}
