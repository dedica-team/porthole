micronaut:
  server:
    # Use an ephemeral port so multiple @MicronautTest classes that boot the full
    # server cannot collide on the default 8080 when run in the same build.
    # Tests read the actual port from EmbeddedServer.port.
    port: 0
    cors:
      enabled: true
      configurations:
        default:
          allowed-origins:
            - http://localhost:5173
          allowed-methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          allow-credentials: true
  security:
    token:
      jwt:
        enabled: true
        signatures:
          secret:
            generator:
              secret: ${PORTHOLE_JWT_SECRET:${porthole.auth.jwt.secret}}
              jws-algorithm: HS256

endpoints:
  all:
    enabled: false
  health:
    enabled: true
    sensitive: false

porthole:
  auth:
    cookie:
      cookie-name: "porthole_auth"
      cookie-path: "/"
      cookie-same-site: "Lax"
      cookie-secure: false
    jwt:
      secret: "test-secret-key-for-unit-tests-only-do-not-use-in-production-256bit!!"
      expiration-ms: 3600000
      issuer: "porthole-test"
      audience: "porthole-test-api"
    github:
      client-id: test-client-id
      client-secret: test-client-secret
      redirect-uri: "http://localhost:5173/auth/github/callback"
    allowed-origins: "http://localhost:5173"
  storage:
    # Relative to the module working directory; lives under build/ and is cleaned
    # by `gradle clean` without polluting the source tree.
    path: ${porthole.test.storage.path:build/porthole-test-storage}
  game:
    wave-intermission-period: "PT1H"
